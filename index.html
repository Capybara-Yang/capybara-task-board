<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#FAF3E9">
<title>卡皮巴拉任务台 · Capybara Task Board</title>
<style>
  :root{
    --bg:#FAF3E9;
    --card:#FFFFFF;
    --card-warm:#FDF8F0;
    --primary:#A0896B;
    --primary-deep:#8A6F52;
    --accent:#F0A04B;
    --accent-deep:#E08A2E;
    --accent-soft:#FBE8CE;
    --text:#4A3B2C;
    --text-soft:#9A8A75;
    --danger:#D9534F;
    --danger-soft:#FBE9E7;
    --success:#7FA96B;
    --success-soft:#EAF3E4;
    --info-soft:#E3ECF5;
    --info:#5F7F9E;
    --border:#F0E4D2;
    --radius:18px;
    --radius-sm:12px;
    --shadow:0 2px 12px rgba(138,111,82,.08);
    --nav-h:62px;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html{-webkit-text-size-adjust:100%;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",Roboto,sans-serif;
    background:var(--bg);
    background-image:radial-gradient(circle at 12% 8%, rgba(240,160,75,.06) 0 180px, transparent 180px),
                     radial-gradient(circle at 90% 30%, rgba(184,152,127,.07) 0 220px, transparent 220px);
    color:var(--text);
    min-height:100vh;
    line-height:1.55;
  }
  button{font-family:inherit;border:none;background:none;cursor:pointer;color:inherit;}
  input,select,textarea{font-family:inherit;font-size:16px;color:var(--text);}
  svg{display:block;}

  /* ---------- 头部 ---------- */
  .app-header{
    max-width:960px;margin:0 auto;padding:18px 16px 10px;
    display:flex;align-items:center;justify-content:space-between;gap:10px;
  }
  .header-left{display:flex;align-items:center;gap:12px;min-width:0;}
  .logo{flex-shrink:0;}
  .title-wrap h1{font-size:21px;font-weight:800;letter-spacing:.5px;}
  .title-row{display:flex;align-items:center;gap:6px;min-width:0;}
  .title-row h1{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .title-edit{
    flex-shrink:0;width:30px;height:30px;border-radius:9px;border:none;cursor:pointer;
    background:rgba(185,148,111,.14);color:#8A6F52;display:flex;align-items:center;justify-content:center;
    transition:background .15s;
  }
  .title-edit:active{background:rgba(185,148,111,.32);}
  .title-edit svg{display:block;}
  .title-wrap p{font-size:12.5px;color:var(--text-soft);margin-top:1px;}
  .badge-local{
    flex-shrink:0;font-size:11px;color:var(--primary-deep);background:var(--accent-soft);
    border:1px solid rgba(240,160,75,.35);padding:4px 10px;border-radius:999px;white-space:nowrap;
  }

  /* ---------- 备份提醒横幅 ---------- */
  .backup-banner{
    max-width:960px;margin:4px auto 0;padding:0 16px;
  }
  .backup-banner .inner{
    background:var(--accent-soft);border:1px dashed rgba(224,138,46,.5);
    border-radius:var(--radius-sm);padding:10px 14px;font-size:13.5px;color:#8A5A1E;
    display:flex;align-items:center;gap:10px;flex-wrap:wrap;
  }
  .backup-banner .inner button{
    background:var(--accent-deep);color:#fff;font-size:12.5px;padding:6px 14px;
    border-radius:999px;font-weight:600;
  }

  /* ---------- 今日要处理 ---------- */
  .today-section{
    max-width:960px;margin:10px auto 0;padding:0 16px;
  }
  .today-card{
    background:linear-gradient(135deg,#FFFCF6 0%,#FBF1E1 100%);
    border:1.5px solid var(--border);border-radius:var(--radius);
    padding:16px;box-shadow:var(--shadow);
  }
  .section-head{display:flex;align-items:center;gap:8px;margin-bottom:10px;}
  .section-head h2{font-size:16.5px;font-weight:800;display:flex;align-items:center;gap:7px;}
  .section-head .hicon{color:var(--accent-deep);}
  .section-count{
    font-size:11.5px;background:var(--danger-soft);color:var(--danger);
    padding:2px 9px;border-radius:999px;font-weight:700;
  }
  .section-count.ok{background:var(--success-soft);color:var(--success);}
  .today-item{
    display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:var(--radius-sm);
    background:#fff;margin-bottom:8px;border:1px solid var(--border);
  }
  .today-item:last-child{margin-bottom:0;}
  .today-item.overdue{border-color:rgba(217,83,79,.4);background:#FFF7F6;}
  .ti-main{flex:1;min-width:0;}
  .ti-title{font-size:14.5px;font-weight:600;display:flex;align-items:center;gap:6px;min-width:0;}
  .ti-title .ti-txt{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .ti-title .ti-ic{flex-shrink:0;color:var(--primary);display:flex;}
  .today-item.overdue .ti-title{color:var(--danger);}
  .ti-meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px;align-items:center;}
  .mini-chip{
    font-size:10.5px;padding:2px 8px;border-radius:999px;font-weight:600;white-space:nowrap;
  }
  .chip-red{background:var(--danger-soft);color:var(--danger);}
  .chip-orange{background:var(--accent-soft);color:var(--accent-deep);}
  .chip-brown{background:#F3EADC;color:var(--primary-deep);}
  .chip-green{background:var(--success-soft);color:var(--success);}
  .chip-blue{background:var(--info-soft);color:var(--info);}
  .chip-gray{background:#F1EEE8;color:#A39C90;}
  .done-btn{
    width:38px;height:38px;border-radius:50%;border:2px solid var(--border);
    display:flex;align-items:center;justify-content:center;color:#C9BBA5;flex-shrink:0;transition:all .15s;
  }
  .done-btn:hover{border-color:var(--success);color:var(--success);}
  .today-habits{margin-top:12px;display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;}
  .today-habits-label{font-size:12px;color:var(--text-soft);align-self:center;flex-shrink:0;font-weight:600;}
  .th-chip{
    flex-shrink:0;display:flex;align-items:center;gap:6px;min-height:40px;padding:0 14px;
    background:#fff;border:1.5px solid var(--border);border-radius:999px;font-size:13px;font-weight:600;
    color:var(--primary-deep);transition:all .15s;
  }
  .th-chip.on{background:var(--success-soft);border-color:var(--success);color:var(--success);}
  .empty-today{display:flex;flex-direction:column;align-items:center;padding:8px 0 4px;}
  .empty-today p{font-size:13.5px;color:var(--text-soft);margin-top:6px;}

  /* ---------- 导航 ---------- */
  #main-nav{
    max-width:960px;margin:16px auto 0;padding:0 16px;
    display:flex;gap:8px;
  }
  .nav-btn{
    flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;
    padding:10px 4px;border-radius:var(--radius-sm);font-size:12px;font-weight:600;
    color:var(--text-soft);background:rgba(255,255,255,.6);border:1.5px solid transparent;transition:all .15s;
  }
  .nav-btn.active{background:#fff;color:var(--primary-deep);border-color:var(--border);box-shadow:var(--shadow);}
  .nav-btn.active svg{color:var(--accent-deep);}

  /* ---------- 主体 ---------- */
  main{max-width:960px;margin:0 auto;padding:14px 16px calc(var(--nav-h) + 96px);}
  .view.hidden{display:none;}
  .data-card.hidden{display:none;}

  .view-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;}
  .view-head h2{font-size:17px;font-weight:800;display:flex;align-items:center;gap:7px;}
  .view-head .hicon{color:var(--accent-deep);}
  .view-head .sub{font-size:12px;color:var(--text-soft);margin-top:2px;font-weight:400;}

  /* ---------- 文件夹标签 ---------- */
  .folder-tabs{
    display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin-bottom:12px;
    scrollbar-width:none;
  }
  .folder-tabs::-webkit-scrollbar{display:none;}
  .f-tab{
    flex-shrink:0;display:flex;align-items:center;gap:6px;min-height:40px;padding:0 16px;
    border-radius:999px;background:#fff;border:1.5px solid var(--border);
    font-size:13.5px;font-weight:600;color:var(--primary-deep);transition:all .15s;
  }
  .f-tab.active{background:var(--primary-deep);color:#fff;border-color:var(--primary-deep);}
  .f-tab .cnt{font-size:11px;opacity:.75;}
  .f-tab.manage{border-style:dashed;color:var(--text-soft);}

  /* ---------- 任务卡片 ---------- */
  .task-card{
    display:flex;align-items:flex-start;gap:12px;background:var(--card);
    border:1.5px solid var(--border);border-radius:var(--radius);padding:14px 14px;
    margin-bottom:10px;box-shadow:var(--shadow);transition:all .15s;cursor:pointer;
  }
  .task-card:hover{border-color:var(--primary);}
  .task-card.done{opacity:.55;background:var(--card-warm);}
  .task-card.done .t-title{text-decoration:line-through;color:var(--text-soft);}
  .task-card .t-check{
    width:40px;height:40px;border-radius:50%;border:2px solid var(--border);
    display:flex;align-items:center;justify-content:center;color:#C9BBA5;flex-shrink:0;margin-top:2px;transition:all .15s;
  }
  .task-card .t-check:hover{border-color:var(--success);color:var(--success);}
  .task-card.done .t-check{background:var(--success);border-color:var(--success);color:#fff;}
  .t-main{flex:1;min-width:0;}
  .t-title{font-size:15px;font-weight:650;word-break:break-word;}
  .t-meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px;align-items:center;}
  .t-attach{display:inline-flex;align-items:center;gap:3px;font-size:10.5px;color:var(--text-soft);}

  /* ---------- 倒计时卡片 ---------- */
  .cd-card{
    display:flex;align-items:center;gap:14px;background:var(--card);
    border:1.5px solid var(--border);border-radius:var(--radius);padding:16px;
    margin-bottom:10px;box-shadow:var(--shadow);cursor:pointer;transition:all .15s;
  }
  .cd-card:hover{border-color:var(--primary);}
  .cd-card.urgent{border-color:rgba(217,83,79,.45);background:#FFF9F8;}
  .cd-card.soon{border-color:rgba(240,160,75,.5);}
  .cd-days{flex-shrink:0;text-align:center;min-width:74px;}
  .cd-num{font-size:30px;font-weight:800;line-height:1;color:var(--primary-deep);}
  .cd-card.urgent .cd-num{color:var(--danger);}
  .cd-card.soon .cd-num{color:var(--accent-deep);}
  .cd-unit{font-size:11px;color:var(--text-soft);margin-top:3px;}
  .cd-main{flex:1;min-width:0;}
  .cd-title{font-size:15px;font-weight:650;word-break:break-word;display:flex;align-items:center;gap:6px;flex-wrap:wrap;}
  .cd-date{font-size:12.5px;color:var(--text-soft);margin-top:3px;}
  .cd-haslink{display:inline-flex;align-items:center;gap:3px;font-size:10.5px;color:var(--info);}

  /* ---------- 习惯卡片 ---------- */
  .habit-card{
    background:var(--card);border:1.5px solid var(--border);border-radius:var(--radius);
    padding:16px;margin-bottom:12px;box-shadow:var(--shadow);
  }
  .habit-top{display:flex;align-items:center;gap:10px;margin-bottom:10px;}
  .habit-dot{width:12px;height:12px;border-radius:50%;flex-shrink:0;}
  .h-name{flex:1;font-size:15.5px;font-weight:700;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .h-streak{
    display:flex;align-items:center;gap:4px;font-size:12.5px;font-weight:700;
    color:var(--accent-deep);background:var(--accent-soft);padding:4px 10px;border-radius:999px;flex-shrink:0;
  }
  .icon-btn{
    width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;
    color:var(--text-soft);flex-shrink:0;transition:all .15s;
  }
  .icon-btn:hover{background:var(--danger-soft);color:var(--danger);}
  .heatmap-wrap{overflow-x:auto;padding:4px 0 8px;scrollbar-width:none;}
  .heatmap-wrap::-webkit-scrollbar{display:none;}
  .heatmap{min-width:270px;}
  .habit-foot{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;}
  .h-total{font-size:12px;color:var(--text-soft);}
  .check-btn{
    display:flex;align-items:center;gap:8px;min-height:46px;padding:0 22px;border-radius:999px;
    font-size:14.5px;font-weight:700;background:var(--success-soft);color:var(--success);
    border:2px solid rgba(127,169,107,.4);transition:all .15s;
  }
  .check-btn.on{background:var(--success);color:#fff;border-color:var(--success);}
  .hm-tip{font-size:11px;color:#C4B79F;margin-top:8px;}

  /* ---------- 数据管理 ---------- */
  .data-card{
    background:var(--card);border:1.5px solid var(--border);border-radius:var(--radius);
    padding:16px;margin-bottom:12px;box-shadow:var(--shadow);
  }
  .data-card h3{font-size:14.5px;font-weight:750;margin-bottom:10px;display:flex;align-items:center;gap:7px;}
  .stats-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;}
  .stat-box{background:var(--card-warm);border-radius:var(--radius-sm);padding:12px 8px;text-align:center;}
  .stat-num{font-size:24px;font-weight:800;color:var(--primary-deep);}
  .stat-label{font-size:11px;color:var(--text-soft);margin-top:2px;}
  .btn-row{display:flex;gap:10px;flex-wrap:wrap;}
  .btn{
    display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:46px;
    padding:0 20px;border-radius:var(--radius-sm);font-size:14px;font-weight:650;transition:all .15s;
  }
  .btn-primary{background:var(--primary-deep);color:#fff;}
  .btn-primary:hover{background:#755C42;}
  .btn-outline{background:#fff;border:1.5px solid var(--border);color:var(--primary-deep);}
  .btn-outline:hover{border-color:var(--primary);}
  .btn-danger{background:#fff;border:1.5px solid rgba(217,83,79,.4);color:var(--danger);}
  .btn-danger:hover{background:var(--danger-soft);}
  .btn-ghost{background:var(--accent-soft);color:var(--accent-deep);}
  .data-note{font-size:12.5px;color:var(--text-soft);line-height:1.7;}

  /* ---------- 悬浮按钮 ---------- */
  #fab{
    position:fixed;right:18px;bottom:calc(var(--nav-h) + 20px + env(safe-area-inset-bottom));
    width:58px;height:58px;border-radius:50%;background:var(--accent-deep);color:#fff;
    display:flex;align-items:center;justify-content:center;box-shadow:0 6px 18px rgba(224,138,46,.4);
    transition:transform .15s;z-index:50;
  }
  #fab:hover{transform:scale(1.06);}
  #fab.hidden{display:none;}

  /* ---------- 弹窗 ---------- */
  .modal{position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;}
  .modal.hidden{display:none;}
  .modal-mask{position:absolute;inset:0;background:rgba(74,59,44,.45);}
  .modal-card{
    position:relative;background:#fff;border-radius:22px;width:min(560px,100%);
    max-height:86vh;display:flex;flex-direction:column;box-shadow:0 18px 50px rgba(74,59,44,.25);
    animation:popIn .18s ease-out;
  }
  @keyframes popIn{from{transform:translateY(14px);opacity:0;}to{transform:none;opacity:1;}}
  .modal-head{
    display:flex;align-items:center;justify-content:space-between;padding:16px 18px 12px;
    border-bottom:1px solid var(--border);flex-shrink:0;
  }
  .modal-head h3{font-size:16.5px;font-weight:800;}
  .modal-body{padding:16px 18px 20px;overflow-y:auto;}
  .form .label{display:block;font-size:13px;font-weight:650;color:var(--primary-deep);margin:14px 0 6px;}
  .form .label:first-child{margin-top:0;}
  .input,.form select,.form textarea{
    width:100%;border:1.5px solid var(--border);border-radius:var(--radius-sm);
    padding:11px 13px;background:var(--card-warm);outline:none;transition:border .15s;
  }
  .input:focus,.form select:focus,.form textarea:focus{border-color:var(--accent);}
  .form textarea{resize:vertical;min-height:72px;}
  .seg{display:flex;gap:0;border:1.5px solid var(--border);border-radius:var(--radius-sm);overflow:hidden;}
  .seg-btn{
    flex:1;min-height:44px;font-size:13px;font-weight:600;color:var(--text-soft);
    background:var(--card-warm);border-right:1px solid var(--border);
  }
  .seg-btn:last-child{border-right:none;}
  .seg-btn.active{background:var(--primary-deep);color:#fff;}
  .seg-btn.active.p0{background:var(--danger);}
  .seg-btn.active.p1{background:var(--accent-deep);}
  .form-actions{display:flex;gap:10px;margin-top:20px;}
  .form-actions .btn{flex:1;}
  .img-previews{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px;}
  .img-thumb{position:relative;width:72px;height:72px;border-radius:10px;overflow:hidden;border:1.5px solid var(--border);}
  .img-thumb img{width:100%;height:100%;object-fit:cover;}
  .img-thumb .rm{
    position:absolute;top:2px;right:2px;width:20px;height:20px;border-radius:50%;
    background:rgba(0,0,0,.55);color:#fff;display:flex;align-items:center;justify-content:center;
  }
  .file-btn{
    display:inline-flex;align-items:center;gap:7px;min-height:42px;padding:0 16px;margin-top:8px;
    border:1.5px dashed var(--primary);border-radius:var(--radius-sm);color:var(--primary-deep);
    font-size:13px;font-weight:600;
  }
  .detail-rows{display:flex;flex-direction:column;gap:12px;}
  .d-row .d-label{font-size:11.5px;color:var(--text-soft);font-weight:650;margin-bottom:3px;}
  .d-row .d-val{font-size:14.5px;word-break:break-word;}
  .d-row .d-val.pre{white-space:pre-wrap;background:var(--card-warm);border-radius:var(--radius-sm);padding:10px 12px;border:1px solid var(--border);}
  .link-btn{
    display:inline-flex;align-items:center;gap:7px;min-height:44px;padding:0 16px;margin-top:4px;
    background:var(--info-soft);color:var(--info);border-radius:var(--radius-sm);font-size:13.5px;font-weight:650;
    text-decoration:none;word-break:break-all;
  }
  .confirm-msg{font-size:14.5px;color:var(--text);margin:4px 0 2px;line-height:1.7;}
  .folder-row{
    display:flex;align-items:center;gap:10px;padding:12px 10px;border-bottom:1px solid var(--border);
  }
  .folder-row:last-child{border-bottom:none;}
  .folder-row .f-name{flex:1;font-size:14.5px;font-weight:650;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .folder-row .f-cnt{font-size:12px;color:var(--text-soft);flex-shrink:0;}
  .icon-btn.edit:hover{background:var(--accent-soft);color:var(--accent-deep);}

  /* ---------- 图片灯箱 ---------- */
  .lightbox{position:fixed;inset:0;z-index:200;background:rgba(40,32,24,.9);display:flex;align-items:center;justify-content:center;padding:20px;}
  .lightbox.hidden{display:none;}
  .lightbox img{max-width:92vw;max-height:88vh;border-radius:12px;}

  /* ---------- Toast ---------- */
  .toast{
    position:fixed;left:50%;bottom:calc(var(--nav-h) + 90px);transform:translateX(-50%);
    background:rgba(74,59,44,.92);color:#fff;font-size:13.5px;padding:10px 20px;
    border-radius:999px;z-index:300;white-space:nowrap;animation:popIn .2s;
  }
  .toast.hidden{display:none;}

  footer{
    max-width:960px;margin:0 auto;padding:0 16px 26px;text-align:center;
    font-size:12px;color:#C4B79F;
  }

  /* ---------- 桌面端 ---------- */
  @media (min-width:768px){
    .app-header{padding-top:26px;}
    .title-wrap h1{font-size:24px;}
    main{padding-bottom:60px;}
    #fab{bottom:34px;right:34px;}
    .toast{bottom:110px;}
    #main-nav{max-width:960px;}
    .nav-btn{flex-direction:row;gap:8px;justify-content:center;padding:12px 8px;font-size:14px;}
  }

  /* ---------- 移动端 ---------- */
  @media (max-width:767px){
    .modal{align-items:flex-end;}
    .modal-card{
      width:100%;border-radius:22px 22px 0 0;max-height:88vh;
      padding-bottom:env(safe-area-inset-bottom);
    }
    #main-nav{
      position:fixed;left:0;right:0;bottom:0;margin:0;max-width:none;
      background:rgba(255,253,249,.96);backdrop-filter:blur(10px);
      border-top:1px solid var(--border);
      padding:6px 10px calc(6px + env(safe-area-inset-bottom));
      gap:4px;z-index:60;
    }
    .nav-btn{background:none;border:none;flex:1;}
    .nav-btn.active{background:none;box-shadow:none;border-color:transparent;color:var(--accent-deep);}
    main{padding-bottom:calc(var(--nav-h) + 100px);}
    .stats-grid{grid-template-columns:repeat(2,1fr);}
    .cd-num{font-size:26px;}
    .today-item,.task-card,.cd-card{padding:12px;}
  }
</style>
</head>
<body>

<div class="app-header">
  <div class="header-left">
    <div class="logo">
      <svg viewBox="0 0 120 104" width="50" height="44" aria-label="卡皮巴拉">
        <circle cx="60" cy="17" r="11" fill="#F5A83C"/>

var FOLDER_COLORS = [
  {bg:'#F3E5D8', fg:'#8A6F52'},
  {bg:'#E8F0E0', fg:'#6E8F5B'},
  {bg:'#E3ECF5', fg:'#5F7F9E'},
  {bg:'#F5E3EB', fg:'#B07290'},
  {bg:'#EAE3F5', fg:'#7E6BA8'},
  {bg:'#F5EDD8', fg:'#A98B3F'}
];
var HABIT_COLORS = ['#E08A2E','#7FA96B','#5F7F9E','#C9839E','#8B79C4','#B8987F'];

/* ---------- 工具函数 ---------- */
function esc(s){
  return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}
function uid(p){ return p + Date.now().toString(36) + Math.floor(Math.random() * 10000); }
function fmtLocal(d){
  var y = d.getFullYear();
  var m = ('0' + (d.getMonth() + 1)).slice(-2);
  var day = ('0' + d.getDate()).slice(-2);
  return y + '-' + m + '-' + day;
}
function todayStr(){ return fmtLocal(new Date()); }
function dateOffset(n){
  var d = new Date();
  d.setDate(d.getDate() + n);
  return fmtLocal(d);
}
function daysUntil(dateStr){
  var t = new Date(todayStr() + 'T00:00:00');
  var d = new Date(dateStr + 'T00:00:00');
  return Math.round((d - t) / 86400000);
}
function findTask(id){
  for (var i = 0; i < db.tasks.length; i++) if (db.tasks[i].id === id) return db.tasks[i];
  return null;
}
function findCountdown(id){
  for (var i = 0; i < db.countdowns.length; i++) if (db.countdowns[i].id === id) return db.countdowns[i];
  return null;
}
function findHabit(id){
  for (var i = 0; i < db.habits.length; i++) if (db.habits[i].id === id) return db.habits[i];
  return null;
}
function findFolder(id){
  for (var i = 0; i < db.folders.length; i++) if (db.folders[i].id === id) return db.folders[i];
  return null;
}
function folderColor(id){
  var idx = 0;
  for (var i = 0; i < db.folders.length; i++){
    if (db.folders[i].id === id){ idx = i; break; }
  }
  return FOLDER_COLORS[idx % FOLDER_COLORS.length];
}

/* ---------- 数据层 ---------- */
function defaultData(){
  return {
    folders: [],
    tasks: [],
    countdowns: [],
    habits: [],
    initialized: true
  };
}
function load(){
  try{
    var raw = localStorage.getItem(DB_KEY);
    if (raw){
      db = JSON.parse(raw);
      if (!db.folders) db.folders = [];
      if (!db.tasks) db.tasks = [];
      if (!db.countdowns) db.countdowns = [];
      if (!db.habits) db.habits = [];
    } else {
      db = defaultData();
      save();
    }
  }catch(e){
    db = defaultData();
  }
}
function save(){
  try{
    localStorage.setItem(DB_KEY, JSON.stringify(db));
  }catch(e){
    showToast('保存失败：存储空间可能满了（图片太多）');
  }
}

/* ---------- Toast / 弹窗 / 灯箱 ---------- */
function showToast(msg){
  var t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.remove('hidden');
  if (toastTimer) clearTimeout(toastTimer);
  toastTimer = setTimeout(function(){ t.classList.add('hidden'); }, 2200);
}
function openModal(title, html){
  document.getElementById('modal-title').textContent = title;
  document.getElementById('modal-body').innerHTML = html;
  document.getElementById('modal').classList.remove('hidden');
  document.body.style.overflow = 'hidden';
}
function closeModal(){
  document.getElementById('modal').classList.add('hidden');
  document.getElementById('modal-body').innerHTML = '';
  document.body.style.overflow = '';
}
function showImage(src){
  document.getElementById('lightbox-img').src = src;
  document.getElementById('lightbox').classList.remove('hidden');
}
function confirmDialog(title, msg, onOk){
  window.__confirmOk = onOk;
  openModal(title,
    '<p class="confirm-msg">' + esc(msg) + '</p>' +
    '<div class="form-actions">' +
    '<button class="btn btn-outline" onclick="closeModal()">取消</button>' +
    '<button class="btn btn-danger" onclick="runConfirmOk()">确定</button>' +
    '</div>');
}
function runConfirmOk(){
  var fn = window.__confirmOk;
  window.__confirmOk = null;
  closeModal();
  if (fn) fn();
}

/* ---------- Tab 切换 ---------- */
function setTab(tab){
  currentTab = tab;
  var views = ['tasks', 'countdown', 'habits', 'data'];
  for (var i = 0; i < views.length; i++){
    var v = document.getElementById('view-' + views[i]);
    if (v) v.classList.toggle('hidden', views[i] !== tab);
  }
  var btns = document.querySelectorAll('.nav-btn');
  for (var j = 0; j < btns.length; j++){
    btns[j].classList.toggle('active', btns[j].getAttribute('data-tab') === tab);
  }
  document.getElementById('fab').classList.toggle('hidden', tab === 'data');
  window.scrollTo({top: 0, behavior: 'smooth'});
}
function fabAction(){
  if (currentTab === 'tasks') openTaskForm();
  else if (currentTab === 'countdown') openCountdownForm();
  else if (currentTab === 'habits') openHabitForm();
}

/* ---------- 渲染：头部 ---------- */
var WEEK_CN = ['日','一','二','三','四','五','六'];
function renderHeader(){
  var d = new Date();
  var week = WEEK_CN[d.getDay()];
  var quotes = ['慢慢来，比较快','先做今天的事','泡完温泉再做也行','一步一步来就好','今天也是情绪稳定的一天'];
  var q = quotes[d.getDate() % quotes.length];
  document.getElementById('header-date').textContent =
    d.getFullYear() + ' 年 ' + (d.getMonth() + 1) + ' 月 ' + d.getDate() + ' 日 · 周' + week + ' · ' + q;
}

/* ---------- 渲染：今天要处理 ---------- */
function renderToday(){
  var list = document.getElementById('today-list');
  var items = [];

  db.tasks.forEach(function(t){
    if (t.status === 'done') return;
    var d = t.dueDate ? daysUntil(t.dueDate) : null;
    if (d !== null && d <= 3) items.push({kind: 'task', d: d, obj: t});
    else if (d === null && t.priority === 'P0') items.push({kind: 'task', d: 9999, obj: t});
  });
  db.countdowns.forEach(function(c){
    var d = daysUntil(c.date);

/* ---------- 渲染：任务列表 ---------- */
function taskSort(a, b){
  var aDone = a.status === 'done', bDone = b.status === 'done';
  if (aDone !== bDone) return aDone ? 1 : -1;
  var da = a.dueDate ? daysUntil(a.dueDate) : 9999;
  var dbv = b.dueDate ? daysUntil(b.dueDate) : 9999;
  if (da !== dbv) return da - dbv;
  var pr = {P0: 0, P1: 1, P2: 2};
  if (pr[a.priority] !== pr[b.priority]) return pr[a.priority] - pr[b.priority];
  return (b.createdAt || 0) - (a.createdAt || 0);
}
function renderTasks(){
  renderFolderTabs();
  var listEl = document.getElementById('task-list');
  var tasks = db.tasks.slice().sort(taskSort);
  if (folderFilter !== 'all'){
    tasks = tasks.filter(function(t){ return t.folderId === folderFilter; });
  }
  if (tasks.length === 0){
    listEl.innerHTML = '<div class="empty-today" style="padding:22px 0">' +
      '<p>这里还没有任务，点右下角 + 新建一条吧</p></div>';
    return;
  }
  var html = '';
  tasks.forEach(function(t){
    var folder = findFolder(t.folderId);
    var fc = folderColor(t.folderId);
    var folderChip = folder ? '<span class="mini-chip" style="background:' + fc.bg + ';color:' + fc.fg + '">' + esc(folder.name) + '</span>' : '<span class="mini-chip chip-gray">未分类</span>';
    var prClass = t.priority === 'P0' ? 'chip-red' : (t.priority === 'P1' ? 'chip-orange' : 'chip-gray');
    var dueChip = '';
    if (t.status !== 'done' && t.dueDate){
      var d = daysUntil(t.dueDate);
      if (d < 0) dueChip = '<span class="mini-chip chip-red">逾期 ' + (-d) + ' 天</span>';
      else if (d === 0) dueChip = '<span class="mini-chip chip-orange">今天</span>';
      else if (d <= 3) dueChip = '<span class="mini-chip chip-brown">' + d + ' 天后</span>';
      else dueChip = '<span class="mini-chip chip-gray">' + t.dueDate.slice(5) + '</span>';
    } else if (t.dueDate){
      dueChip = '<span class="mini-chip chip-gray">' + t.dueDate.slice(5) + '</span>';
    }
    var statusChip = '';
    if (t.status === 'doing') statusChip = '<span class="mini-chip chip-blue">进行中</span>';
    if (t.status === 'done') statusChip = '<span class="mini-chip chip-green">已完成</span>';
    var attach = '';
    if (t.images && t.images.length) attach += '<span class="t-attach">' + ICONS.image + t.images.length + ' 张图</span>';
    if (t.note) attach += '<span class="t-attach">' + ICONS.note + '有备注</span>';

    html += '<div class="task-card' + (t.status === 'done' ? ' done' : '') + '" onclick="showTaskDetail(\'' + t.id + '\')">' +
      '<button class="t-check" onclick="event.stopPropagation();toggleTaskDone(\'' + t.id + '\')" title="切换完成">' + ICONS.check + '</button>' +
      '<div class="t-main"><div class="t-title">' + esc(t.title) + '</div>' +
      '<div class="t-meta"><span class="mini-chip ' + prClass + '">' + t.priority + '</span>' + folderChip + dueChip + statusChip + attach + '</div>' +
      '</div></div>';
  });
  listEl.innerHTML = html;
}

function setSeg(btn){
  var siblings = btn.parentNode.querySelectorAll('.seg-btn');
  for (var i = 0; i < siblings.length; i++) siblings[i].classList.remove('active');
  btn.classList.add('active');
}
function getSegVal(id){
  var active = document.querySelector('#' + id + ' .seg-btn.active');
  return active ? active.getAttribute('data-v') : null;
}
function renderFormImages(){
  var el = document.getElementById('tf-imgs');
  if (!el) return;
  var html = '';
  formImages.forEach(function(src, i){
    html += '<div class="img-thumb"><img src="' + src + '" onclick="showImage(\'' + '\')" alt="附件">' +
      '<button class="rm" onclick="removeFormImage(' + i + ')">' +
      '<svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>';
  });
  el.innerHTML = html;
  // 绑定图片点击预览
  var thumbs = el.querySelectorAll('img');
  for (var k = 0; k < thumbs.length; k++){
    (function(idx){
      thumbs[idx].onclick = function(){ showImage(formImages[idx]); };
    })(k);
  }
}
function removeFormImage(i){
  formImages.splice(i, 1);
  renderFormImages();
}
function addTaskImages(input){
  var files = input.files;
  if (!files || files.length === 0) return;
  var remaining = 9 - formImages.length;
  if (remaining <= 0){ showToast('最多只能放 9 张图哦'); input.value = ''; return; }
  var toAdd = Math.min(files.length, remaining);
  if (files.length > remaining) showToast('最多 9 张，超出部分没有添加');
  var done = 0;
  for (var i = 0; i < toAdd; i++){
    (function(file){
      compressImage(file, function(dataUrl){
        formImages.push(dataUrl);
        done++;
        if (done === toAdd){ renderFormImages(); save(); }
      });
    })(files[i]);
  }
  input.value = '';
}
function compressImage(file, cb){
  var reader = new FileReader();
  reader.onload = function(e){
    var img = new Image();
    img.onload = function(){
      var maxW = 800;
      var w = img.width, h = img.height;
      if (w > maxW){ h = Math.round(h * maxW / w); w = maxW; }
      var c = document.createElement('canvas');
      c.width = w; c.height = h;
      c.getContext('2d').drawImage(img, 0, 0, w, h);
      cb(c.toDataURL('image/jpeg', 0.82));
    };
    img.onerror = function(){ showToast('有张图片读取失败了'); };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}
function saveTask(id){
  var title = document.getElementById('tf-title').value.trim();
  if (!title){ showToast('先写一下任务标题吧'); return; }
  var folderId = document.getElementById('tf-folder').value || null;
  var priority = getSegVal('tf-priority') || 'P1';
  var status = getSegVal('tf-status') || 'todo';
  var due = document.getElementById('tf-due').value || null;
  var note = document.getElementById('tf-note').value.trim();

  if (id){
    var t = findTask(id);
    if (t){
      t.title = title; t.folderId = folderId; t.priority = priority;
      t.status = status; t.dueDate = due; t.note = note;
      t.images = formImages.slice();
      if (status === 'done' && !t.completedAt) t.completedAt = Date.now();
      if (status !== 'done') t.completedAt = null;
      t.sample = false;
    }
  } else {
    db.tasks.push({
      id: uid('t'), title: title, folderId: folderId, priority: priority,
      status: status, dueDate: due, note: note, images: formImages.slice(),
      createdAt: Date.now(), completedAt: status === 'done' ? Date.now() : null
    });
  }
  save();
  closeModal();
  renderAll();
  showToast('已保存');
}

/* ---------- 任务：详情 ---------- */
function showTaskDetail(id){
  var t = findTask(id);
  if (!t) return;
  var folder = findFolder(t.folderId);
  var pr = t.priority === 'P0' ? '<span class="mini-chip chip-red">P0 · 今天必须</span>'
        : t.priority === 'P1' ? '<span class="mini-chip chip-orange">P1 · 本周完成</span>'
        : '<span class="mini-chip chip-gray">P2 · 有空就做</span>';
  var st = t.status === 'done' ? '<span class="mini-chip chip-green">已完成</span>'
        : t.status === 'doing' ? '<span class="mini-chip chip-blue">进行中</span>'
        : '<span class="mini-chip chip-gray">未开始</span>';
  var dueTxt = t.dueDate ? t.dueDate : '没有设置';
  if (t.status !== 'done' && t.dueDate){
    var d = daysUntil(t.dueDate);
    if (d < 0) dueTxt += '（逾期 ' + (-d) + ' 天）';
    else if (d === 0) dueTxt += '（就是今天）';
    else dueTxt += '（还有 ' + d + ' 天）';
  }

  var html = '<div class="detail-rows">' +
    '<div class="d-row"><div class="d-val" style="font-size:17px;font-weight:750">' + esc(t.title) + '</div>' +
    '<div class="ti-meta" style="margin-top:8px">' + pr + st +
    (folder ? '<span class="mini-chip chip-brown">' + esc(folder.name) + '</span>' : '<span class="mini-chip chip-gray">未分类</span>') +
    '</div></div>' +
    '<div class="d-row"><div class="d-label">截止日期</div><div class="d-val">' + esc(dueTxt) + '</div></div>';

  if (t.note) html += '<div class="d-row"><div class="d-label">备注</div><div class="d-val pre">' + esc(t.note) + '</div></div>';

  if (t.images && t.images.length){
    html += '<div class="d-row"><div class="d-label">图片附件（' + t.images.length + ' 张，点击看大图）</div>' +
      '<div class="img-previews">';
    t.images.forEach(function(src, i){
      html += '<div class="img-thumb" style="width:84px;height:84px"><img src="' + src + '" onclick="showImageById(\'' + t.id + '\',' + i + ')" alt="附件' + (i + 1) + '"></div>';
    });
    html += '</div></div>';
  }

  html += '<div class="form-actions">' +
    (t.status !== 'done' ? '<button class="btn btn-ghost" onclick="toggleTaskDone(\'' + t.id + '\');closeModal()">' + ICONS.checkBig + '完成</button>' : '') +
    '<button class="btn btn-outline" onclick="openTaskForm(\'' + t.id + '\')">' + ICONS.pencil + '编辑</button>' +
    '<button class="btn btn-danger" onclick="deleteTaskConfirm(\'' + t.id + '\')">' + ICONS.trash + '删除</button>' +
    '</div></div>';

  openModal('任务详情', html);
}
function showImageById(taskId, idx){
  var t = findTask(taskId);
  if (t && t.images && t.images[idx]) showImage(t.images[idx]);
}
function toggleTaskDone(id){
  var t = findTask(id);
  if (!t) return;
  if (t.status === 'done'){
    t.status = 'todo';
    t.completedAt = null;
  } else {
    t.status = 'done';
    t.completedAt = Date.now();
    t.sample = false;
    showToast('完成啦，真棒！');
  }
  save();
  renderAll();
}
function deleteTaskConfirm(id){
  var t = findTask(id);
  if (!t) return;
  confirmDialog('删除任务', '确定删除「' + t.title + '」吗？删除后无法恢复。', function(){
    db.tasks = db.tasks.filter(function(x){ return x.id !== id; });
    save();
    renderAll();
    showToast('已删除');
  });
}

  var f = findFolder(id);
  if (!f) return;
  var cnt = db.tasks.filter(function(t){ return t.folderId === id; }).length;
  var msg = '确定删除文件夹「' + f.name + '」吗？';
  if (cnt > 0) msg += '里面的 ' + cnt + ' 条任务会变成「未分类」，不会被删除。';
  confirmDialog('删除文件夹', msg, function(){
    db.folders = db.folders.filter(function(x){ return x.id !== id; });
    db.tasks.forEach(function(t){ if (t.folderId === id) t.folderId = null; });
    if (folderFilter === id) folderFilter = 'all';
    save();
    renderAll();
    showToast('已删除');
  });
}

/* ---------- 倒计时 ---------- */
function cdSort(a, b){
  var da = daysUntil(a.date), dbv = daysUntil(b.date);
  if (da < 0 && dbv < 0) return dbv - da; // 都过期：新过期的排前面
  return da - dbv;
}
function renderCountdowns(){
  var el = document.getElementById('countdown-list');
  if (db.countdowns.length === 0){
    el.innerHTML = '<div class="empty-today" style="padding:22px 0"><p>还没有倒计时，点右下角 + 加一个</p></div>';
    return;
  }
  var list = db.countdowns.slice().sort(cdSort);
  var html = '';
  list.forEach(function(c){
    var d = daysUntil(c.date);
    var cls = d < 0 ? '' : (d <= 3 ? ' urgent' : (d <= 7 ? ' soon' : ''));
    var num, unit;
    if (d < 0){ num = '已过期'; unit = (-d) + ' 天前'; cls = ''; }
    else if (d === 0){ num = '0'; unit = '就是今天'; cls = ' urgent'; }
    else { num = String(d); unit = '天剩余'; }
    html += '<div class="cd-card' + cls + '" onclick="showCountdownDetail(\'' + c.id + '\')">' +
      '<div class="cd-days"><div class="cd-num"' + (d < 0 ? ' style="font-size:18px"' : '') + '>' + num + '</div>' +
      '<div class="cd-unit">' + unit + '</div></div>' +
      '<div class="cd-main"><div class="cd-title">' + esc(c.title) + '</div>' +
      '<div class="cd-date">' + c.date + '</div>' +
      (c.link ? '<span class="cd-haslink">' + ICONS.link + '有报名链接，点开查看</span>' : '') +
      '</div></div>';
  });
  el.innerHTML = html;
}
function openCountdownForm(id){
  var c = id ? findCountdown(id) : null;
  var html = '<div class="form">' +
    '<label class="label">事件名称</label>' +
    '<input id="cf-title" class="input" maxlength="60" placeholder="比如：英语比赛报名截止" value="' + (c ? esc(c.title) : '') + '">' +
    '<label class="label">日期</label>' +
    '<input id="cf-date" class="input" type="date" value="' + (c ? c.date : '') + '">' +
    '<label class="label">活动链接（可选）</label>' +
    '<input id="cf-link" class="input" type="url" placeholder="https://… 报名/活动页面地址" value="' + (c ? esc(c.link || '') : '') + '">' +
    '<label class="label">报名信息（可选）</label>' +
    '<textarea id="cf-info" maxlength="500" placeholder="报名条件、需要准备的材料、联系人……">' + (c ? esc(c.info || '') : '') + '</textarea>' +
    '<label class="label">备注（可选）</label>' +
    '<textarea id="cf-note" maxlength="300" placeholder="其他想记下的">' + (c ? esc(c.note || '') : '') + '</textarea>' +
    '<div class="form-actions">' +
    '<button class="btn btn-outline" onclick="closeModal()">取消</button>' +
    '<button class="btn btn-primary" onclick="saveCountdown(\'' + (c ? c.id : '') + '\')">保存</button>' +
    '</div></div>';
  openModal(c ? '编辑倒计时' : '新建倒计时', html);
}
function saveCountdown(id){
  var title = document.getElementById('cf-title').value.trim();
  var date = document.getElementById('cf-date').value;
  if (!title){ showToast('先写事件名称'); return; }
  if (!date){ showToast('选一个日期'); return; }
  var link = document.getElementById('cf-link').value.trim();
  var info = document.getElementById('cf-info').value.trim();
  var note = document.getElementById('cf-note').value.trim();
  if (id){
    var c = findCountdown(id);
    if (c){ c.title = title; c.date = date; c.link = link; c.info = info; c.note = note; c.sample = false; }
  } else {
    db.countdowns.push({id: uid('c'), title: title, date: date, link: link, info: info, note: note});
  }
  save();
  closeModal();
  renderAll();
  showToast('已保存');
}
function showCountdownDetail(id){
  var c = findCountdown(id);
  if (!c) return;
  var d = daysUntil(c.date);
  var state;
  if (d < 0) state = '<span class="mini-chip chip-gray">已过期 ' + (-d) + ' 天</span>';
  else if (d === 0) state = '<span class="mini-chip chip-red">就是今天！</span>';
  else if (d <= 3) state = '<span class="mini-chip chip-red">还剩 ' + d + ' 天</span>';
  else if (d <= 7) state = '<span class="mini-chip chip-orange">还剩 ' + d + ' 天</span>';
  else state = '<span class="mini-chip chip-brown">还剩 ' + d + ' 天</span>';

  var html = '<div class="detail-rows">' +
    '<div class="d-row"><div class="d-val" style="font-size:17px;font-weight:750">' + esc(c.title) + '</div>' +
    '<div class="ti-meta" style="margin-top:8px">' + state + '<span class="mini-chip chip-brown">' + c.date + '</span></div></div>';

  if (c.link){
    html += '<div class="d-row"><div class="d-label">活动链接</div>' +
      '<a class="link-btn" href="' + esc(c.link) + '" target="_blank" rel="noopener noreferrer">' + ICONS.extLink + '打开活动 / 报名页面</a></div>';
  }
  if (c.info) html += '<div class="d-row"><div class="d-label">报名信息</div><div class="d-val pre">' + esc(c.info) + '</div></div>';
  if (c.note) html += '<div class="d-row"><div class="d-label">备注</div><div class="d-val pre">' + esc(c.note) + '</div></div>';

  html += '<div class="form-actions">' +
    '<button class="btn btn-outline" onclick="openCountdownForm(\'' + c.id + '\')">' + ICONS.pencil + '编辑</button>' +
    '<button class="btn btn-danger" onclick="deleteCountdownConfirm(\'' + c.id + '\')">' + ICONS.trash + '删除</button>' +
    '</div></div>';
  openModal('倒计时详情', html);
}
function deleteCountdownConfirm(id){
  var c = findCountdown(id);
  if (!c) return;
  confirmDialog('删除倒计时', '确定删除「' + c.title + '」吗？', function(){
    db.countdowns = db.countdowns.filter(function(x){ return x.id !== id; });
    save();
    renderAll();
    showToast('已删除');
  });
}

/* ---------- 习惯打卡 ---------- */
function habitStreak(h){
  var s = 0;
  var d = new Date();
  if (!(h.records && h.records[fmtLocal(d)])) d.setDate(d.getDate() - 1);
  while (h.records && h.records[fmtLocal(d)]){ s++; d.setDate(d.getDate() - 1); }
  return s;
}
function habitTotal(h){
  var n = 0;
  for (var k in h.records) if (h.records[k]) n++;
  return n;
}
function heatmapSVG(h, color){
  var cur = new Date();
  var dow = (cur.getDay() + 6) % 7; // 0=周一
  var start = new Date(cur);
  start.setDate(cur.getDate() - dow - 11 * 7);
  var today = todayStr();
  var cells = '';
  for (var w = 0; w < 12; w++){
    for (var dd = 0; dd < 7; dd++){
      var day = new Date(start);
      day.setDate(start.getDate() + w * 7 + dd);
      var ds = fmtLocal(day);
      if (ds > today) continue;
      var on = h.records && h.records[ds];
      var fill = on ? color : '#F0E7D8';
      cells += '<rect x="' + (w * 13) + '" y="' + (dd * 13) + '" width="11" height="11" rx="3" fill="' + fill + '" style="cursor:pointer" onclick="toggleHabitDay(\'' + h.id + '\',\'' + ds + '\')"><title>' + ds + (on ? ' · 已打卡' : '') + '</title></rect>';
    }
  }
  return '<svg class="heatmap" viewBox="0 0 156 91" width="270" height="158" xmlns="http://www.w3.org/2000/svg">' + cells + '</svg>';
}
function renderHabits(){
  var el = document.getElementById('habit-list');
  if (db.habits.length === 0){
    el.innerHTML = '<div class="empty-today" style="padding:22px 0"><p>还没有习惯，点右下角 + 建一个</p></div>';
    return;
  }
  var html = '';
  var today = todayStr();
  db.habits.forEach(function(h, idx){
    var color = HABIT_COLORS[idx % HABIT_COLORS.length];
    var checked = h.records && h.records[today];
    var streak = habitStreak(h);
    html += '<div class="habit-card">' +
      '<div class="habit-top">' +
      '<span class="habit-dot" style="background:' + color + '"></span>' +
      '<span class="h-name">' + esc(h.name) + '</span>' +
      '<span class="h-streak">' + ICONS.flame + '连续 ' + streak + ' 天</span>' +
      '<button class="icon-btn" onclick="deleteHabitConfirm(\'' + h.id + '\')" title="删除习惯">' + ICONS.trash + '</button>' +
      '</div>' +
      '<div class="heatmap-wrap">' + heatmapSVG(h, color) + '</div>' +
      '<div class="hm-tip">最近 12 周 · 点格子可以补卡 / 取消</div>' +
      '<div class="habit-foot">' +
      '<span class="h-total">累计打卡 ' + habitTotal(h) + ' 天</span>' +
      '<button class="check-btn' + (checked ? ' on' : '') + '" onclick="toggleHabitToday(\'' + h.id + '\')">' + ICONS.checkBig + (checked ? '今日已打卡' : '打卡') + '</button>' +
      '</div></div>';
  });
  el.innerHTML = html;
}
function openHabitForm(){
  var html = '<div class="form">' +
    '<label class="label">习惯名称</label>' +
    '<input id="hf-name" class="input" maxlength="20" placeholder="比如：每日阅读 / 背单词 / 运动" value="">' +
    '<div class="form-actions">' +
    '<button class="btn btn-outline" onclick="closeModal()">取消</button>' +
    '<button class="btn btn-primary" onclick="saveHabit()">保存</button>' +
    '</div></div>';
  openModal('新建习惯', html);
}
function saveHabit(){
  var name = document.getElementById('hf-name').value.trim();
  if (!name){ showToast('写个习惯名称吧'); return; }
  db.habits.push({id: uid('h'), name: name, records: {}});
  save();
  closeModal();
  renderAll();
  showToast('已添加，坚持打卡呀');
}
function toggleHabitToday(id){
  toggleHabitDay(id, todayStr());
}
function toggleHabitDay(id, ds){
  var h = findHabit(id);
  if (!h) return;
  if (!h.records) h.records = {};
  if (h.records[ds]){ delete h.records[ds]; }
  else { h.records[ds] = true; h.sample = false; }
  save();
  renderToday();
  renderHabits();
}
function deleteHabitConfirm(id){
  var h = findHabit(id);
  if (!h) return;
  confirmDialog('删除习惯', '确定删除「' + h.name + '」吗？打卡历史会一起删掉。', function(){
    db.habits = db.habits.filter(function(x){ return x.id !== id; });
    save();
    renderAll();
    showToast('已删除');
  });
}

/* ---------- 数据管理 ---------- */
function renderData(){
  var doneCnt = db.tasks.filter(function(t){ return t.status === 'done'; }).length;
  var totalCheckins = 0;
  db.habits.forEach(function(h){ for (var k in h.records) if (h.records[k]) totalCheckins++; });
  document.getElementById('stats-grid').innerHTML =
    '<div class="stat-box"><div class="stat-num">' + db.tasks.length + '</div><div class="stat-label">任务总数</div></div>' +
    '<div class="stat-box"><div class="stat-num">' + doneCnt + '</div><div class="stat-label">已完成</div></div>' +
    '<div class="stat-box"><div class="stat-num">' + db.countdowns.length + '</div><div class="stat-label">倒计时</div></div>' +
    '<div class="stat-box"><div class="stat-num">' + db.habits.length + '</div><div class="stat-label">打卡习惯</div></div>';

  var hasSample = db.tasks.some(function(t){ return t.sample; }) ||
                  db.countdowns.some(function(c){ return c.sample; }) ||
                  db.habits.some(function(h){ return h.sample; });
  document.getElementById('sample-card').classList.toggle('hidden', !hasSample);
  if (hasSample){
    document.getElementById('sample-note').textContent = '有旧版示例数据残留，可以一键清掉。';
    document.getElementById('sample-btns').innerHTML =
      '<button class="btn btn-outline" onclick="clearSamples()">清空示例数据</button>';
  }

  // 备份提醒
  var total = db.tasks.length + db.countdowns.length + totalCheckins;
  var banner = document.getElementById('backup-banner');
  var ack = localStorage.getItem(BACKUP_ACK_KEY);
  if (total >= 30 && ack !== todayStr()){
    document.getElementById('backup-text').textContent =
      '数据已经积累 ' + total + ' 条啦，建议导出一份备份，有备无患～';
    banner.classList.remove('hidden');
  } else {
    banner.classList.add('hidden');
  }
}
function dismissBackup(){
  localStorage.setItem(BACKUP_ACK_KEY, todayStr());
  document.getElementById('backup-banner').classList.add('hidden');
}
function exportJSON(){
  var payload = {
    app: 'capybara-task-board',
    version: 1,
    exportedAt: new Date().toISOString(),
    data: db
  };
  var blob = new Blob([JSON.stringify(payload, null, 2)], {type: 'application/json'});
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = '卡皮巴拉任务台备份_' + todayStr() + '.json';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(function(){ URL.revokeObjectURL(a.href); }, 1200);
  showToast('备份已导出');
}
function importJSONFile(input){
  var f = input.files && input.files[0];
  if (!f) return;
  var reader = new FileReader();
  reader.onload = function(e){
    var parsed;
    try{ parsed = JSON.parse(e.target.result); }
    catch(err){ showToast('导入失败：文件不是有效的 JSON'); input.value = ''; return; }
    var d = parsed && parsed.data ? parsed.data : parsed;
    if (!d || !Array.isArray(d.tasks) || !Array.isArray(d.folders)){
      showToast('导入失败：文件格式不对');
      input.value = '';
      return;
    }
    confirmDialog('导入备份', '导入会覆盖当前的全部数据（覆盖前建议先导出一份）。确定继续吗？', function(){
      db = {
        folders: d.folders || [],
        tasks: d.tasks || [],
        countdowns: d.countdowns || [],
        habits: d.habits || [],
        initialized: true
      };
      folderFilter = 'all';
      save();
      renderAll();
      showToast('导入成功');
    });
  };
  reader.readAsText(f);
  input.value = '';
}
function clearSamples(){
  confirmDialog('清空示例数据', '会删掉所有标记为「示例」的任务、倒计时和打卡记录（文件夹保留）。确定吗？', function(){
    db.tasks = db.tasks.filter(function(t){ return !t.sample; });
    db.countdowns = db.countdowns.filter(function(c){ return !c.sample; });
    db.habits = db.habits.filter(function(h){ return !h.sample; });
    save();
    renderAll();
    showToast('示例数据已清空');
  });
}
function clearAll(){
  confirmDialog('清空全部数据', '所有任务、文件夹、倒计时、打卡记录都会被永久删除，无法恢复！确定要清空吗？', function(){
    confirmDialog('再次确认', '真的真的要清空吗？建议先「导出 JSON 备份」。这一步之后数据就找不回来了。', function(){
      db = defaultData();
      save();
      folderFilter = 'all';
      renderAll();
      showToast('已清空全部数据');
    });
  });
}

/* ---------- 总渲染 ---------- */
function renderAll(){
  renderHeader();
  renderToday();
  renderTasks();
  renderCountdowns();
  renderHabits();
  renderData();
}

/* ---------- 工作台名称 ---------- */
function applyTitle(){
  var t = '';
  try{ t = localStorage.getItem(TITLE_KEY) || ''; }catch(e){}
  var name = t.trim() || '卡皮巴拉任务台';
  document.getElementById('app-title').textContent = name;
  document.title = name;
}
function openTitleForm(){
  var cur = '';
  try{ cur = localStorage.getItem(TITLE_KEY) || ''; }catch(e){}
  openModal('修改工作台名称',
    '<div class="form">' +
    '<label class="label">新名称</label>' +
    '<input id="wt-name" class="input" maxlength="20" placeholder="比如：小函的任务台" value="' + esc(cur || '卡皮巴拉任务台') + '">' +
    '<div class="form-actions">' +
    '<button class="btn btn-outline" onclick="closeModal()">取消</button>' +
    '<button class="btn btn-primary" onclick="saveTitle()">保存</button>' +
    '</div></div>');

function saveTitle(){

  try{ localStorage.setItem(TITLE_KEY, name); }catch(e){}

  closeModal();
  showToast('改名完成～');
}

/* ---------- 启动 ---------- */
function injectIcons(){
  var spans = document.querySelectorAll('[data-icon]');
  for (var i = 0; i < spans.length; i++){
    var name = spans[i].getAttribute('data-icon');
    if (ICONS[name]) spans[i].innerHTML = ICONS[name];
  }
  document.getElementById('today-icon').innerHTML = ICONS.alert;
}
load();
injectIcons();
applyTitle();
renderAll();
setTab('tasks');
